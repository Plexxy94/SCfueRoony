name: News aktualisieren

on:
  schedule:
    - cron: "17 * * * *"   # stündlich
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: News abrufen
        run: python3 tools/fetch_news.py news.json
      - name: Mining-Daten abrufen (UEX)
        run: python3 tools/fetch_mining.py mining.json || echo "UEX nicht erreichbar, alte Daten bleiben"
      - name: Änderungen speichern
        run: |
          git add news.json mining.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "News und Mining-Daten aktualisiert"
          git push
